kind = "solution"
spec = "polynomial-multiplication/negacyclic@1.0.0"
fingerprint = "sha256:e4000ee01ca295cf"

# Where your three functions are. The platform generated the loop that calls
# them; these names tell it which symbols to bind.
[entry]
init = "fherma_init"
run  = "fherma_run"
free = "fherma_free"

# Built inside the challenge image (fherma/cupqc), which provides CUDA 12.8 and
# the cuPQC SDK. Unlike the default generated C++ build, CMakeLists.txt here
# enables the CUDA language, links cuPQC BigInt, and builds the device code with
# -dlto (the BigInt implementation ships as device-LTO objects). It targets
# sm_89 — the L40S the runner carries — overridable with -DFHERMA_CUDA_ARCH.
[build]
command = "cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"

[runtime]
language = "cpp"
run = "./build/solution"
